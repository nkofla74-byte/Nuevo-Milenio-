name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for secret scanning

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (exact lockfile)
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Internal pages must not ship
        run: |
          if find dist -path '*academia*' -o -path '*progreso*' | grep -q .; then
            echo "Dev-only pages found in dist/"; exit 1
          fi

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E + accessibility (axe)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Lighthouse budgets (production build)
        run: |
          npx astro preview --port 4322 &
          for i in $(seq 1 60); do curl -sf http://localhost:4322/ >/dev/null && break; sleep 1; done
          npm run lighthouse -- http://localhost:4322

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
